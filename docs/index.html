<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="arayuz/stil.css" />
  </head>
  <body>
    <div id="uygulama">
      <!-- Üst çubuk: başlık + eylem düğmeleri (tasokey#43). Düğmeler ayrı bir kutuda durur ki
           başlık dar kademede kısalsın, düğmeleri itmesin (stil.css #ustCubuk h1 / #ustCubukEylemler).
           "Oyunu bitir" yalnız el sürerken görünür; kararı `arayuz/kabuk.js` verir (ADR-016). -->
      <div id="ustCubuk">
        <h1 id="baslikMetni"></h1>
        <div id="ustCubukEylemler">
          <button id="oyunuBitirButonu" class="ust-cubuk-dugmesi" type="button" hidden></button>
          <button id="dilDugmesi" class="ust-cubuk-dugmesi" type="button"></button>
        </div>
      </div>
      <div id="durumSatiri"></div>
      <div id="masa">
        <div id="koseSolUst" class="kose" data-kose="solUst" tabindex="0" role="button">
          <div class="kose-yigin" id="koseSolUstYigin"></div>
          <div class="kose-sayac" id="koseSolUstSayac" aria-hidden="true"></div>
        </div>
        <div id="kenarUst" class="kenar kenar-ust">
          <div class="kenar-ad" id="kenarUstAd"></div>
          <div class="kenar-raf-yatay" aria-hidden="true"></div>
          <div class="kenar-taslar" id="kenarUstTaslar"></div>
        </div>
        <div id="koseSagUst" class="kose" data-kose="sagUst" tabindex="0" role="button">
          <div class="kose-yigin" id="koseSagUstYigin"></div>
          <div class="kose-sayac" id="koseSagUstSayac" aria-hidden="true"></div>
        </div>

        <div id="kenarSol" class="kenar kenar-sol">
          <div class="kenar-ad" id="kenarSolAd"></div>
          <div class="kenar-raf-dikey" aria-hidden="true"></div>
          <div class="kenar-taslar" id="kenarSolTaslar"></div>
        </div>
        <div id="merkez">
          <div class="yigin">
            <div class="yigin-baslik" id="yerDestesiBaslik"></div>
            <div class="yigin-tas-alani" id="yerDestesi" data-hedef="yerDestesi" tabindex="0" role="button"></div>
            <div class="yigin-sayac" id="yerDestesiSayac"></div>
            <div class="yigin-ipucu" id="yerDestesiIpucu" aria-live="polite"></div>
          </div>
          <div class="yigin">
            <div class="yigin-baslik" id="gostergeBaslik"></div>
            <div class="yigin-tas-alani" id="gosterge"></div>
          </div>
        </div>
        <div id="kenarSag" class="kenar kenar-sag">
          <div class="kenar-ad" id="kenarSagAd"></div>
          <div class="kenar-raf-dikey" aria-hidden="true"></div>
          <div class="kenar-taslar" id="kenarSagTaslar"></div>
        </div>

        <div id="koseSolAlt" class="kose" data-kose="solAlt" tabindex="0" role="button">
          <div class="kose-yigin" id="koseSolAltYigin"></div>
          <div class="kose-sayac" id="koseSolAltSayac" aria-hidden="true"></div>
        </div>
        <div id="rafAlani" class="kenar kenar-alt">
          <div id="rafBaslik"></div>
          <div id="raf"></div>
        </div>
        <div id="koseSagAlt" class="kose" data-kose="sagAlt" tabindex="0" role="button">
          <div class="kose-yigin" id="koseSagAltYigin"></div>
          <div class="kose-sayac" id="koseSagAltSayac" aria-hidden="true"></div>
        </div>
      </div>
      <div id="telefonUyarisi" class="telefon-uyarisi">
        <div class="telefon-uyarisi-ikon" aria-hidden="true"></div>
        <div id="telefonUyarisiMetni"></div>
      </div>
    </div>
    <!-- Başlangıç ekranı (ADR-016, tasokey#42): kalıcı pencere, ilk açılışta görünür; hangi panelin
         açık olduğuna `arayuz/kabuk.js` durum makinesi karar verir. Metinler dil anahtarından. -->
    <div id="baslangicPaneli">
      <div id="baslangicKutusu">
        <h2 id="baslangicBaslik"></h2>
        <div id="zorlukBaslik"></div>
        <div id="zorlukSecimi" role="radiogroup" aria-labelledby="zorlukBaslik">
          <button id="zorlukKolay" class="zorluk-dugmesi" type="button" role="radio" data-zorluk="kolay"></button>
          <button id="zorlukOrta" class="zorluk-dugmesi" type="button" role="radio" data-zorluk="orta"></button>
          <button id="zorlukZor" class="zorluk-dugmesi" type="button" role="radio" data-zorluk="zor"></button>
        </div>
        <button id="yeniOyunButonu" type="button"></button>
      </div>
    </div>
    <!-- Sonuç penceresi: kutu içeriğiyle boyutlanır (sabit en/boy yok — Sahip ek bilgisi 2,
         tasokey#50). Oyuncuların kalan taşları AÇILIR bölümdür (ek bilgi 1): düğme listeyi
         aç/kapat eder, pencere her açıldığında kapalı başlar (kabuk.dokumAcik).
         Pencere KÜÇÜLTÜLEBİLİR (tasokey#65): küçükken yalnız ilk düğme kalır, masanın üstü
         (rakip ıstakaları) açılır; durumu yine kabuk tutar (kabuk.sonucKucuk). -->
    <div id="sonucPaneli">
      <div id="sonucKutusu">
        <button id="kucultAcKapaButonu" class="kucult-dugmesi" type="button"
                aria-pressed="false" aria-controls="sonucKutusu"></button>
        <div id="sonucMetni"></div>
        <button id="dokumAcKapaButonu" class="acilir-baslik" type="button"
                aria-expanded="false" aria-controls="sonucKalanTaslar"></button>
        <ul id="sonucKalanTaslar" hidden></ul>
        <div id="sonucDugmeleri">
          <button id="yeniElButonu" type="button"></button>
          <button id="baslangicaDonButonu" type="button"></button>
        </div>
      </div>
    </div>
    <!-- Oyunu bitirme onayı (tasokey#43): üst çubuktaki düğme el sürerken bu pencereyi açar; hangi
         pencerenin açık olduğuna yine `arayuz/kabuk.js` karar verir (kabuk.onay). Metinler dil
         anahtarından; vazgeçilince kabuk masada kalır ve el bozulmaz. -->
    <div id="onayPaneli" role="dialog" aria-modal="true" aria-labelledby="onayMetni">
      <div id="onayKutusu">
        <div id="onayMetni"></div>
        <div id="onayDugmeleri">
          <button id="onayEvetButonu" type="button"></button>
          <button id="onayHayirButonu" type="button"></button>
        </div>
      </div>
    </div>
    <!-- Bilgilendirme penceresi (tasokey#50, ADR-016/8): insan oyuncu okey/sahte okey attığında
         açılır. Soru sormaz, hamleyi geri almaz — tek düğmesi yalnız kapatır; hangi bilginin
         gösterildiğine `arayuz/kabuk.js` karar verir (kabuk.bilgi). Metinler dil anahtarından. -->
    <div id="bilgiPaneli" role="dialog" aria-modal="true" aria-labelledby="bilgiMetni">
      <div id="bilgiKutusu">
        <div id="bilgiMetni"></div>
        <div id="bilgiDugmeleri">
          <button id="bilgiTamamButonu" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="arayuz/ekran.js"></script>
  </body>
</html>
